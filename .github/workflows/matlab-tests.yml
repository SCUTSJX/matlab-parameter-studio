name: MATLAB tests

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: matlab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Install a self-hosted Windows runner with MATLAB on PATH.
    # See tests/README.md for the local command and runner requirements.
    runs-on: [self-hosted, Windows, matlab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run MATLAB test suite
        shell: pwsh
        run: |
          matlab -batch "addpath('tests'); run_tests" 2>&1 | Tee-Object -FilePath matlab-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MATLAB test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-tests-log
          path: matlab-tests.log
          if-no-files-found: ignore
